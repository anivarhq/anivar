name: Release

# Builds signed, auto-updatable installers for every platform and publishes them
# to a GitHub Release. Triggered by pushing a version tag (e.g. `v1.0.1`) or run
# manually. Produces:
#   • Windows  — NSIS + MSI            (DirectML: any DX12 GPU, no toolkit)
#   • macOS    — .dmg (arm64 + x64)    (CoreML: Apple Neural Engine)
#   • Linux    — .deb + .AppImage      (CPU)
# plus the signed updater artifacts (.sig) and `latest.json` manifest the
# in-app updater reads.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           — minisign private key (from `tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password (empty string if none)
# (the matching PUBLIC key lives in src-tauri/tauri.conf.json → plugins.updater.pubkey)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.1)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Resolve the tag once, and turn CHANGELOG.md into the release body.
  #
  # Its own job because the build below is a five-way matrix: generating notes in
  # each would do the same work five times, and whichever runner happened to
  # create the release first would decide what the body said.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      tag:  ${{ steps.resolve.outputs.tag }}
      body: ${{ steps.body.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # git describe needs history for the fallback

      - name: Resolve tag
        id: resolve
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Build release body
        id: body
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          if bash .github/scripts/changelog-section.sh "$TAG" CHANGELOG.md > notes.md; then
            echo "Notes from CHANGELOG.md for $TAG"
          else
            echo "::warning::$TAG has no CHANGELOG.md section — falling back to git log"
            {
              PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
              if [ -n "$PREV" ]; then git log "$PREV..$TAG" --pretty='- %s' --no-merges
              else git log -20 --pretty='- %s' --no-merges; fi
            } > notes.md
          fi
          {
            echo "## Install"
            echo
            echo "Download the installer for your platform below. Existing installs update automatically."
            echo
            # Keep this in step with README.md's "Before you install". The macOS
            # line used to say right-click → Open, which recent macOS no longer
            # accepts for an un-notarised app: the only route is Privacy & Security.
            echo "> The installers are **not** code-signed yet, so both operating systems"
            echo "> will stop you the first time. **Windows** shows \"Windows protected your"
            echo "> PC\" — click **More info** → **Run anyway**. **macOS** refuses an app that"
            echo "> isn't notarised: try to open it once, then go to **System Settings →"
            echo "> Privacy & Security** and click **Open Anyway** (or"
            echo "> \`xattr -dr com.apple.quarantine /Applications/Anivar.app\`)."
            echo
            echo "Every file has a \`.sha256\` beside it — see [Verify your download](https://github.com/anivarhq/anivar#verify-your-download)."
            echo
            echo "## Changes"
            echo
            cat notes.md
          } > body.md
          {
            echo "body<<ANIVAR_NOTES_EOF"
            cat body.md
            echo "ANIVAR_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "--- preview ---"; head -30 body.md

  release:
    needs: notes
    name: ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel (x86_64-apple-darwin) is deliberately absent: ort 2.0.0-rc.12
          # publishes no prebuilt ONNX Runtime for that target, so the build fails in
          # ort-sys before it reaches anything of ours. Restoring it means compiling
          # ONNX Runtime from source in CI. Apple stopped selling Intel Macs in 2023
          # and this project has none to test on.
          - { os: macos-latest,   label: "macOS (Apple Silicon)", target: aarch64-apple-darwin, args: "--target aarch64-apple-darwin" }
          - { os: ubuntu-latest,  label: "Linux",                 target: "",                   args: "" }
          # ONE Windows installer, built with --features cuda so the CUDA and
          # TensorRT providers are present. It stays a single download because the
          # runtime they need is fetched on first launch ONLY when an NVIDIA adapter
          # is found; everyone else runs DirectML and downloads nothing extra. The
          # provider DLLs were already bundled in every Windows build, so this costs
          # no installer size -- it makes them usable.
          - { os: windows-latest, label: "Windows",               target: "",                   args: "--features cuda" }
          # NVIDIA edition: same app identity (shares footage/DB/settings) but a
          # distinct installer name, built with the CUDA EP. Users on an NVIDIA GPU
          # download this one; the CUDA + cuDNN runtime is fetched on first launch.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux Tauri prerequisites (webkit, appindicator for the tray, etc.)
      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      # ── llama.cpp build prerequisites (on-device LLM) ────────────────────────
      # `llama-cpp-sys-2` compiles llama.cpp from source and runs bindgen, so the
      # release builds need cmake + ninja + libclang on every platform, and an
      # MSVC developer environment on Windows. See the notes beside the dependency
      # in Cargo.toml — each of these cost a failed build to discover.
      - name: llama.cpp prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y cmake ninja-build libclang-dev clang

      - name: llama.cpp prerequisites (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: llama.cpp prerequisites (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: MSVC developer environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Select Ninja generator
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      # Pinned to match ci.yml — a release should be built by the same compiler
      # that gated the code, not by whatever is stable on the day it is tagged.
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # NOTE: there is no longer a step fetching ffmpeg + a default detector into
      # the installer. Bundling them meant DISTRIBUTING them, and the detector was
      # an Ultralytics YOLO (AGPL-3.0) while the ffmpeg build was GPL. Both are now
      # downloaded by the user on demand, which keeps this Apache-2.0 app clear
      # of their terms — see THIRD-PARTY-NOTICES.md.
      #
      # The ONNX provider DLLs below ARE still bundled: they are MIT, and the GPU
      # lanes cannot load without them.
      - name: Stage ONNX provider DLLs (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # `-p ort-sys`, NOT a full build. tauri-build validates bundle.resources
          # inside build.rs, and tauri.windows.conf.json lists these DLLs there --
          # so a full build cannot run until they exist, and they only exist once
          # ort has downloaded them. Building the dependency alone breaks the cycle:
          # ort-sys has no such check, and its build script is what copies them into
          # target/<profile>/.
          cargo build --release --manifest-path src-tauri/Cargo.toml -p ort-sys
          & ./scripts/sync-ort-dlls.ps1 -Profile release

      - name: Build, sign, and publish
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.notes.outputs.tag }}
          releaseName: "Anivar __VERSION__"
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}


  # ── Checksums ──────────────────────────────────────────────────────────────
  # AUTO-UPDATES are already protected: `includeUpdaterJson` above signs the
  # manifest with TAURI_SIGNING_PRIVATE_KEY, and the app refuses an update that
  # fails that signature.
  #
  # A MANUAL download from the Releases page has no such check. The installers
  # are not Authenticode-signed or notarised yet (that needs a purchased
  # certificate), so today a user who downloads the .exe cannot tell a good copy
  # from a tampered one. A published SHA-256 is not a signature — anyone who
  # could replace the artifact could replace the hash — but it does catch a
  # corrupted download and a mirror that altered the file, and it costs nothing.
  # Remove it only when real code signing lands, not before.
  #
  # This hashes the RELEASE ASSETS, not the runners' build output, which is both
  # simpler and strictly more correct than the per-runner step it replaces:
  #
  #   * It hashes the exact bytes a user downloads, end of story.
  #   * Names always match. tauri-action renames on upload — the macOS updater
  #     bundle goes up as `Anivar_aarch64.app.tar.gz` while on disk it is
  #     `Anivar.app.tar.gz` — so hashing disk paths published
  #     `Anivar.app.tar.gz.sha256`, naming a file nobody can download.
  #   * No Windows path handling. tauri-action reports absolute paths with
  #     backslashes, and even normalised they would not stat from the runner's
  #     bash while the file was demonstrably present, so every Windows artifact
  #     was skipped and the step still exited 0: v0.1.0's first build published
  #     Windows installers with no checksum at all, under a green tick.
  #
  # One Linux job instead of the same step on three runners, at 1× minutes.
  checksums:
    needs: [notes, release]
    name: Checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Hash and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.notes.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          # Skip the updater manifest and any checksum from an earlier run.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name
                                | select(endswith(".sha256") or . == "latest.json" | not)' > names

          [ -s names ] || { echo "::error::$TAG has no assets to checksum"; exit 1; }

          # A stable alias per installer, so a download link can be written once
          # and keep working. Asset names carry the version, which means
          # releases/latest/download/Anivar_0.1.1_x64-setup.exe dies at 0.1.2 —
          # every README, blog post and bookmark pointing at it breaks silently.
          # These names never change, so releases/latest/download/<alias> is
          # permanent. Matched on the stable suffix, never on a version string.
          alias_for() {
            case "$1" in
              *_x64-setup.exe)  echo Anivar-windows-x64-setup.exe ;;
              *_aarch64.dmg)    echo Anivar-macos-arm64.dmg ;;
              *_amd64.AppImage) echo Anivar-linux-x86_64.AppImage ;;
              *_amd64.deb)      echo Anivar-linux-amd64.deb ;;
              *.x86_64.rpm)     echo Anivar-linux-x86_64.rpm ;;
              *)                echo '' ;;
            esac
          }

          aliases=0
          while read -r n; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$n" --clobber
            # Relative filename inside the file, so `sha256sum -c x.exe.sha256`
            # works in whatever directory the user downloaded it to.
            sha256sum "$n" > "$n.sha256"
            gh release upload "$TAG" "$n.sha256" --clobber --repo "$GITHUB_REPOSITORY"

            a=$(alias_for "$n")
            if [ -n "$a" ] && [ "$a" != "$n" ]; then
              cp "$n" "$a"
              gh release upload "$TAG" "$a" --clobber --repo "$GITHUB_REPOSITORY"
              rm -f "$a"
              aliases=$((aliases + 1))
            fi
            rm -f "$n"
          done < names

          # Five installers ship, so five aliases must exist or a documented
          # download link is dead and nothing else would have noticed.
          [ "$aliases" -eq 5 ] || {
            echo "::error::expected 5 stable aliases, published $aliases"
            cat names
            exit 1
          }

          echo "Published $(wc -l < names) checksum(s) and $aliases stable aliases:"
          cat names


# ── More acceleration editions (future) ──────────────────────────────────────
# Each accelerator is a separate `ort` feature build, added as another matrix row
# with its own config override for a distinct installer name, e.g.
#   - { os: windows-latest, label: "Windows (Intel OpenVINO)", target: "", args: "--features openvino --config tauri.openvino.conf.json" }
#   - { os: ubuntu-latest,  label: "Linux (AMD ROCm)",         target: "", args: "--features rocm --config tauri.rocm.conf.json" }
# Like the NVIDIA edition, each shares the app identity (footage/DB) and fetches its
# vendor runtime on first launch. (OpenVINO/ROCm also need a `[features]` entry +
# a managed-runtime downloader, mirroring `cuda` / `cuda_runtime.rs`.)
