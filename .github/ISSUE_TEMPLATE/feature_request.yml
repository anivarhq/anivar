name: Feature request
description: Suggest a new feature or enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the use case first — what are you trying to do that's hard or
        impossible with Anivar today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Optional. If you have an idea for how this could work, describe it.
        Otherwise leave blank — sometimes the use case is enough.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        What other approaches did you think about? Why didn't they fit?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Links to similar features in other projects, screenshots, mockups, etc.
